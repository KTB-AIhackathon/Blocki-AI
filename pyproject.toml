[project]
name = "blocki-ai"
version = "0.3.0"
description = "Blocki FastAPI GitHub worker. Spring-internal only."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=2,<3",
  "httpx2>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
blocki-ai = "app.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
